name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm install


    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Build Web App
      run: npm run build

    - name: Capacitor Sync
      run: |
        npx cap add android || true
        npx cap sync android

    - name: Apply Custom App Icons & Keystore
      run: |
        cp -r resources/android/* android/app/src/main/res/
        cp resources/android/prompt-claude.keystore android/app/

    - name: Patch Android Manifest & Build Config
      run: |
        node scripts/patch_manifest.js
        node scripts/patch_gradle.js

    - name: Build Android App (APK)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: prompt-claude-apk
        path: |
          android/app/build/outputs/apk/release/app-release-unsigned.apk
          android/app/build/outputs/apk/release/app-release.apk
