<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="description" content="A premium utility app to remind you to interact with Claude at regular intervals with customizable vibrations." />
    <meta name="theme-color" content="#6366f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Prompt Claude!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <header>
        <img src="/logo.png" alt="Logo" class="logo" />
        <h1>Prompt Claude!</h1>
      </header>

      <main>
        <div class="card main-card">
          <div class="status-container">
            <span id="status-text">Ready to start</span>
            <div id="countdown" class="hidden">05:00:00</div>
          </div>

          <button id="start-btn" class="primary-btn">
            <span class="btn-text">Start Reminder</span>
            <div class="btn-shimmer"></div>
          </button>
        </div>

        <div class="card settings-card">
          <h2>Settings</h2>
          
          <div class="setting-item">
            <label for="interval">Interval (hours)</label>
            <input type="range" id="interval" min="1" max="24" value="5" step="1" />
            <span id="interval-val">5h</span>
          </div>

          <div class="setting-item">
            <label for="vibration">Vibration Pattern</label>
            <select id="vibration">
              <option value="short">Short Pulse</option>
              <option value="long">Long Pulse</option>
              <option value="triple">Triple Beat</option>
              <option value="custom">Custom Pattern</option>
            </select>
          </div>

          <div id="custom-vibration-container" class="setting-item hidden">
            <label for="custom-vibration">Custom Pattern (ms)</label>
            <input type="text" id="custom-vibration" placeholder="200, 100, 200" />
            <small>Comma separated (e.g., 200, 100, 200)</small>
          </div>
        </div>
      </main>

      <footer>
        <p>Stay productive with Claude</p>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
